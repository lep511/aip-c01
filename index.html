  <!-- Custom Dark Theme Styles -->
  <style>
    :root {
      color-scheme: dark;
      
      /* Dark Theme Color Variables */
      --base-background-color: #0d1117;
      --base-color: #e6edf3;
      --base-font-size: 16px;
      --base-line-height: 1.6;
      
      /* Sidebar */
      --sidebar-background: #161b22;
      --sidebar-border-color: #30363d;
      --sidebar-border-width: 1px;
      --sidebar-width: 300px;
      
      /* Sidebar Navigation */
      --sidebar-nav-link-color: #8b949e;
      --sidebar-nav-link-color--hover: #58a6ff;
      --sidebar-nav-link-color--active: #58a6ff;
      --sidebar-nav-link-background--active: #1f6feb1a;
      --sidebar-nav-link-border-radius: 6px;
      --sidebar-nav-link-font-weight--active: 600;
      
      /* Content */
      --content-max-width: 1000px;
      
      /* Headings */
      --heading-color: #f0f6fc;
      --heading-h1-border-color: #21262d;
      --heading-h2-border-color: #21262d;
      --heading-font-weight: 600;
      
      /* Links */
      --link-color: #58a6ff;
      --link-color--hover: #79c0ff;
      --link-text-decoration: none;
      --link-text-decoration--hover: underline;
      
      /* Code */
      --code-inline-background: #161b22;
      --code-inline-border-radius: 6px;
      --code-inline-color: #79c0ff;
      --code-block-background: #161b22;
      --code-block-border-radius: 6px;
      --code-block-border-color: #30363d;
      
      /* Tables */
      --table-border-color: #30363d;
      --table-row-background--hover: #161b22;
      --table-head-background: #161b22;
      
      /* Blockquote */
      --blockquote-border-color: #58a6ff;
      --blockquote-background: #0d1117;
      --blockquote-color: #8b949e;
      
      /* Notice/Callout */
      --notice-background: #1f6feb1a;
      --notice-border-color: #58a6ff;
      
      /* Search */
      --search-input-background: #0d1117;
      --search-input-border-color: #30363d;
      --search-input-color: #e6edf3;
      --search-result-heading-color: #58a6ff;
    }
    
    /* Additional custom styles */
    body {
      background-color: var(--base-background-color);
    }
    
    /* Sidebar branding */
    .sidebar .app-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--heading-color);
      padding: 1.5rem 1.5rem 0.5rem;
    }
    
    /* Sidebar navigation improvements */
    .sidebar-nav ul {
      padding-left: 0;
    }
    
    .sidebar-nav li {
      margin: 0.25rem 0.75rem;
    }
    
    .sidebar-nav a {
      padding: 0.5rem 0.75rem;
      display: block;
      border-radius: var(--sidebar-nav-link-border-radius);
      transition: all 0.2s ease;
    }
    
    .sidebar-nav a:hover {
      background: var(--sidebar-nav-link-background--active);
    }
    
    /* Content area improvements */
    .markdown-section {
      padding: 2rem 2rem 3rem;
    }
    
    /* Code blocks */
    .markdown-section pre > code {
      background: var(--code-block-background);
      border: 1px solid var(--code-block-border-color);
    }
    
    /* Smooth transitions */
    a, button {
      transition: color 0.2s ease, background-color 0.2s ease;
    }
    
    /* Improved table styling */
    .markdown-section table {
      border-collapse: collapse;
      margin: 1.5rem 0;
      width: 100%;
    }
    
    .markdown-section th {
      background: var(--table-head-background);
      font-weight: 600;
      padding: 0.75rem 1rem;
    }
    
    .markdown-section td {
      padding: 0.75rem 1rem;
    }
    
    /* Emoji support */
    .emoji {
      height: 1.2em;
      vertical-align: middle;
    }
    
    /* Cover page adjustments if needed */
    section.cover {
      background: var(--base-background-color) !important;
    }
    
    /* Skip to content link (accessibility) */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--link-color);
      color: var(--base-background-color);
      padding: 8px 16px;
      text-decoration: none;
      z-index: 100;
      border-radius: 0 0 4px 0;
      font-weight: 600;
    }
    
    .skip-link:focus {
      top: 0;
      outline: 2px solid white;
      outline-offset: 2px;
    }
    
    /* Responsive adjustments */
    @media screen and (max-width: 768px) {
      :root {
        --sidebar-width: 280px;
        --base-font-size: 15px;
      }
      
      .markdown-section {
        padding: 1.5rem 1rem 2rem;
      }
      
      .sidebar .app-name {
        font-size: 1.3rem;
        padding: 1rem 1rem 0.5rem;
      }
      
      .markdown-section table {
        display: block;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
    }
    
    /* Print styles */
    @media print {
      .sidebar,
      .sidebar-toggle,
      .github-corner {
        display: none !important;
      }
      
      .markdown-section {
        max-width: 100% !important;
        padding: 0 !important;
      }
      
      a[href]:after {
        content: " (" attr(href) ")";
        font-size: 0.8em;
        font-style: italic;
      }
    }
    
    /* Focus visible for better keyboard navigation */
    :focus-visible {
      outline: 2px solid var(--link-color);
      outline-offset: 2px;
      border-radius: 2px;
    }
    
    /* Smooth scroll behavior */
    html {
      scroll-behavior: smooth;
    }
    
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
